name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    env:
      CANOPY_SKIP_SDK_HARNESS: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup mise
        uses: jdx/mise-action@v2

      - name: Install tools via mise
        run: mise install

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Format check
        run: mise exec -- cargo fmt --all -- --check

      - name: Clippy
        run: mise exec -- cargo clippy --all-targets --all-features -- -D warnings

      - name: Tests (nextest)
        run: mise exec -- cargo nextest run --workspace

      - name: Tests (workspace)
        run: mise exec -- cargo test --workspace

      - name: Doctests
        run: mise exec -- cargo test --workspace --doc

      - name: Bench compile
        run: mise exec -- cargo bench -p canopy-lib --no-run

      - name: Build
        run: mise exec -- cargo build --workspace
