<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Canopy</title>
    <meta name="description" content="Semantic notebook for understanding codebases" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0f0f1a" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  </head>
  <body class="bg-background">
    <!-- Fix #1: Shim process for Pi SDK's unguarded process.env references -->
    <script>window.process={env:{},versions:{}};</script>
    <!-- Fix #8: Respect system dark mode preference -->
    <script>
      if (window.matchMedia("(prefers-color-scheme: dark)").matches) {
        document.documentElement.classList.add("dark");
      }
    </script>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
